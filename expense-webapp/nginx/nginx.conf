user  nginx;
worker_processes  auto;

# access_log/error_log stay at their stock paths: the nginx:alpine base image
# already symlinks them to /dev/stdout and /dev/stderr, so writes go to the
# container's log stream rather than the (read-only) filesystem.
error_log  /var/log/nginx/error.log notice;
# The dataplane runs this container with a read-only root filesystem, so the
# pid file and the rendered server config (written by
# docker-entrypoint.d/15-aep-api-proxy.sh) both live under /tmp, the one path
# guaranteed writable at runtime.
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    include /tmp/conf.d/*.conf;
}
