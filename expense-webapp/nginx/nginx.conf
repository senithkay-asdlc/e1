user  nginx;
worker_processes  auto;

# access_log/error_log stay at their stock paths: the nginx:alpine base image
# already symlinks them to /dev/stdout and /dev/stderr, so writes go to the
# container's log stream rather than the (read-only) filesystem.
error_log  /var/log/nginx/error.log notice;
# The dataplane runs this container with a read-only root filesystem. /tmp is
# part of that root fs and is NOT guaranteed writable here, but /dev/shm is a
# separate tmpfs the container runtime provides independent of the root fs's
# writability, so the pid file and the rendered server config (written by
# docker-entrypoint.d/15-aep-api-proxy.sh) both live there instead.
pid        /dev/shm/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # nginx also needs writable temp paths for request/response buffering —
    # these default to locations under the read-only root (typically
    # /var/cache/nginx or /var/lib/nginx/tmp/*), so point them at /dev/shm
    # alongside the pid file and rendered config above.
    client_body_temp_path /dev/shm/client_temp;
    proxy_temp_path       /dev/shm/proxy_temp;
    fastcgi_temp_path     /dev/shm/fastcgi_temp;
    uwsgi_temp_path       /dev/shm/uwsgi_temp;
    scgi_temp_path        /dev/shm/scgi_temp;

    include /dev/shm/conf.d/*.conf;
}
